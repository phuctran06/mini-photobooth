<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniPhotobooth</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="photobooth">

        <h1>MiniPhotobooth</h1>

        <div class="camera-container">
            <video
                id="camera"
                autoplay
                playsinline
            ></video>
        </div>

        <!-- Canvas dùng để chụp frame từ camera -->
        <canvas id="canvas"></canvas>

        <div class="controls">
            <button id="startCamera">
                Start Camera
            </button>

            <button id="capturePhoto">
                Capture
            </button>
        </div>

        <div class="preview-container">
            <h2>Preview</h2>

            <img
                id="preview"
                alt="Captured photo"
            >
        </div>

    </main>

    <script src="./js/app.js"></script>

</body>
</html>
